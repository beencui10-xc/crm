<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>客户跟进管理系统 V5 | Customer Follow-up Management</title>
    <meta name="description" content="客户信息登记、跟进记录、批量处理的网页版管理系统 V5（浅色主题，Google Sheets 云同步）" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="ambient-grid"></div>
    </div>

    <!-- ============ HEADER ============ -->
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#60a5fa" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="16" fill="none" stroke="url(#lg)" stroke-width="2" />
            <path d="M14 14h12v12H14z" fill="none" stroke="url(#lg)" stroke-width="1.5" />
            <circle cx="20" cy="20" r="3" fill="url(#lg)" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">客户跟进管理 V5</span>
          <span class="brand-sub">Customer Follow-up Management System</span>
        </div>
      </div>

      <div class="toolbar">
        <button class="tbtn primary" id="btnOpen" title="打开 Excel 客户总表">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span>打开总表</span>
        </button>
        <button class="tbtn" id="btnSave" title="保存到 Excel 文件">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          <span>保存导出</span>
        </button>
        <div class="tbtn-divider"></div>
        <button class="tbtn" id="btnImport" title="批量导入 NewList 中的新客户">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
          <span>批量导入</span>
        </button>
        <button class="tbtn" id="btnNew" title="新建客户">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          <span>新建客户</span>
        </button>
        <button class="tbtn" id="btnBatchUpdate" title="批量更新 ConvertList">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>批量更新</span>
        </button>
        <button class="tbtn" id="btnExportConvert" title="导出筛选客户到 ConvertList">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3M16 6l-4-4-4 4"/></svg>
          <span>导出ConvertList</span>
        </button>
        <button class="tbtn danger" id="btnConfig" title="配置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>配置</span>
        </button>
        <input type="file" id="fileInput" accept=".xls,.xlsx,.xlsm" hidden />
      </div>
    </header>

    <!-- ============ STATS BAR ============ -->
    <div class="statsbar" id="statsbar">
      <div class="stat-pill">
        <span class="stat-label">客户总数</span>
        <strong id="statTotal">0</strong>
      </div>
      <div class="stat-pill followup">
        <span class="stat-label">待跟进</span>
        <strong id="statFollowup">0</strong>
      </div>
      <div class="stat-pill" id="cloudSyncStatus" style="font-size:11px;color:var(--ink-faint);">☁️ 云库未连接</div>
      <div class="stat-pill" id="ratingBreakdown"></div>
      <div class="stat-pill right" id="lastSaved">未加载数据</div>
    </div>

    <!-- ============ MAIN ============ -->
    <main class="workspace" id="workspace">
      <!-- LEFT: Customer list -->
      <section class="list-pane">
        <div class="pane-header">
          <span class="pane-title">客户列表</span>
          <div class="filter-row">
            <input type="text" id="searchInput" placeholder="搜索 公司/ID/联系人/网址…" class="search-input" />
            <select id="filterCategory" class="filter-select" title="分类筛选"></select>
            <select id="filterRating" class="filter-select" title="等级筛选"></select>
            <label class="filter-check"><input type="checkbox" id="filterFollowup" checked /> 跟进</label>
            <button class="sbtn small" id="btnSearch">搜索</button>
            <button class="sbtn ghost small" id="btnClearSearch">清空</button>
          </div>
        </div>
        <div class="list-body" id="listBody">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <p>请点击「打开总表」加载 Excel 文件</p>
            <span>支持 .xlsx / .xlsm / .xls 格式</span>
          </div>
        </div>
        <div class="list-footer">
          <button class="sbtn ghost" id="btnPrev">◄ 上一条</button>
          <span class="page-info" id="pageInfo">0 / 0</span>
          <input type="number" id="gotoRow" min="1" placeholder="跳转" class="goto-input" />
          <button class="sbtn ghost" id="btnNext">下一条 ►</button>
        </div>
      </section>

      <!-- RIGHT: Detail editor -->
      <section class="detail-pane" id="detailPane">
        <div class="detail-empty">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6M19 8v6"/></svg>
          <p>选择左侧客户或新建客户开始编辑</p>
        </div>
      </section>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast" hidden></div>

    <!-- Config modal -->
    <div class="modal-backdrop" id="configModal" hidden>
      <div class="modal modal-lg">
        <div class="modal-header">
          <span class="modal-title">系统配置</span>
          <button class="modal-close" id="configClose">×</button>
        </div>
        <div class="modal-body" id="configBody"></div>
        <div class="modal-footer">
          <button class="sbtn" id="configSave">保存配置</button>
          <button class="sbtn ghost" id="configCancel">取消</button>
        </div>
      </div>
    </div>

    <!-- Confirm modal -->
    <div class="modal-backdrop" id="confirmModal" hidden>
      <div class="modal">
        <div class="modal-title" id="confirmTitle">确认</div>
        <div class="modal-info" id="confirmMsg"></div>
        <div class="modal-actions">
          <button class="mbtn primary" id="confirmYes">确定</button>
          <button class="mbtn ghost" id="confirmNo">取消</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
